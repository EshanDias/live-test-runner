# Weekly dependency updates: one grouped PR per ecosystem for minor and patch
# versions, and a PR of its own for each major version, so a major can be
# tested and fixed on its own without holding up the rest.
#
# Dependabot opens its PRs against main. The PR checks (Branch rules) fail them
# there on purpose: main only takes release/* and hotfix/*. To take an update,
# change the PR's base to the release/* branch it should ship in (Edit, next to
# the title) and merge it there.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait a week before offering a new version: a hijacked release is usually
    # found and pulled within days. Security fixes are not delayed.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # These follow the supported-versions policy (scripts/support-floor.js,
      # checked on every PR; a monthly workflow opens an issue when the
      # minimum may move), not the latest release.
      # Must stay at the lowest VS Code the extension supports (engines.vscode).
      - dependency-name: '@types/vscode'
      # The extension's and runner's Node types match the Node inside that VS Code.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Ships inside the extension (out/vendor/babel-parser.js): it lists tests
      # and runs in the user's own Vitest process, on whatever Node they have.
      # Babel 8 needs Node 22.18+ and is an ES module; the policy check fails it
      # while an older Node is supported.
      - dependency-name: '@babel/parser'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
