name: PR Checks

on:
  pull_request:
    branches: ['**']

jobs:
  branch-rules:
    name: Branch rules
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch names and targets
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$HEAD" in
            release/*|feat/*|hotfix/*|bugfix/*) ;;
            *) echo "::error::Branch '$HEAD' must start with release/, feat/, hotfix/ or bugfix/"; exit 1 ;;
          esac
          if [[ "$BASE" == "main" && "$HEAD" != release/* && "$HEAD" != hotfix/* ]]; then
            echo "::error::main only accepts PRs from release/* or hotfix/* (got '$HEAD')"; exit 1
          fi
          if [[ "$BASE" == release/* && "$HEAD" != feat/* && "$HEAD" != bugfix/* && "$HEAD" != hotfix/* ]]; then
            echo "::error::release/* only accepts PRs from feat/*, bugfix/* or hotfix/* (got '$HEAD')"; exit 1
          fi
          if [[ "$HEAD" == bugfix/* && "$BASE" != feat/* && "$BASE" != release/* ]]; then
            echo "::error::bugfix/* may only target a feat/* or release/* branch (got '$BASE')"; exit 1
          fi
          if [[ "$HEAD" == release/* && "$BASE" != "main" ]]; then
            echo "::error::release/* may only target main (got '$BASE')"; exit 1
          fi
          if [[ "$HEAD" == hotfix/* && "$BASE" != "main" && "$BASE" != release/* ]]; then
            echo "::error::hotfix/* must target main or a release/* branch (got '$BASE')"; exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm (version from "packageManager" in package.json), Node 24, the
      # pnpm store cache and `pnpm install` — all in one step.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
      - run: pnpm run build
      - run: pnpm lint
      - run: pnpm test

  # The pytest plugin shipped with the extension (packages/runner/src/framework/pytest/ltr_pytest.py),
  # tested with pytest itself on every supported pytest major (7 is still widely used — owner, 2026-10-24).
  pytest-plugin:
    name: pytest plugin (pytest ${{ matrix.pytest }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pytest: '7.4.*', python: '3.12' }
          - { pytest: '8.4.*', python: '3.12' }
          - { pytest: '8.4.*', python: '3.13' }
          - { pytest: '9.1.*', python: '3.12' }
          - { pytest: '9.1.*', python: '3.13' }
          - { pytest: '9.1.*', python: '3.14' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check "pytest==${{ matrix.pytest }}" coverage
      - run: python -m pytest packages/runner/python-tests -p no:cacheprovider -v

  # Real VS Code + real Jest against the fixture projects in e2e/fixtures
  # (plain Jest, jest.config.ts / ts-jest, async .mjs config, Create React App).
  # Every fixture's results are also compared with a plain Jest run.
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The runner context (runner.temp) is only available inside steps, so
    # LTR_E2E_RUNS_DIR is set on the steps that use it.
    env:
      LTR_E2E_VSCODE: stable
    steps:
      - uses: actions/checkout@v7
      # pnpm (version from "packageManager" in package.json), Node 24, the
      # pnpm store cache and `pnpm install` — all in one step.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
      - run: pnpm run build
      # Python for the pytest fixtures (each gets its own .venv from requirements-e2e.txt).
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/fixtures/*/requirements-e2e.txt
      # npm cache for the fixtures' own installs (react-scripts is large)
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: e2e-npm-${{ runner.os }}-${{ hashFiles('e2e/fixtures/*/package.json') }}
      - uses: actions/cache@v6
        with:
          path: .vscode-test
          key: e2e-vscode-${{ runner.os }}-${{ github.run_id }}
          restore-keys: e2e-vscode-${{ runner.os }}-
      - name: Run e2e (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node e2e/run.js --all
        env:
          LTR_E2E_RUNS_DIR: ${{ runner.temp }}/e2e
          LTR_E2E_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Run e2e
        if: runner.os != 'Linux'
        run: node e2e/run.js --all
        env:
          LTR_E2E_RUNS_DIR: ${{ runner.temp }}/e2e
          LTR_E2E_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/e2e/*/report.json
            ${{ runner.temp }}/e2e/*/extension.log
            ${{ runner.temp }}/e2e/*/jest-output.log
          if-no-files-found: ignore

  version-bump:
    name: Version bump (PRs to main)
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a higher version than main
        env:
          BASE: ${{ github.base_ref }}
        run: |
          for f in package.json packages/vscode-extension/package.json; do
            new=$(node -p "require('./$f').version")
            old=$(git show "origin/$BASE:$f" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            echo "$f: $old -> $new"
            highest=$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n1)
            if [[ "$new" == "$old" || "$highest" != "$new" ]]; then
              echo "::error::$f version must be bumped above $old (found $new)"; exit 1
            fi
          done
