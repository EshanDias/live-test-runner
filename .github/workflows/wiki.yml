name: Publish Wiki

# The Wiki is a copy of docs/, rebuilt whenever main changes there.
# docs/ is the source: pages edited on the Wiki itself are overwritten.
# One-time setup: create any page on the Wiki first (the Wiki repository
# exists only after that), and in Settings → General → Features tick
# "Restrict editing to collaborators only".
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/build-wiki.js']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish docs/ to the Wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the pages
        run: node scripts/build-wiki.js "$RUNNER_TEMP/pages"
      - name: Push to the Wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          # Replace everything: pages removed from docs/ disappear from the Wiki too.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/pages/." .
          git add -A
          if git diff --cached --quiet; then echo "Wiki already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push
