name: Security

# Three checks, on every PR and weekly (new advisories appear without any
# change here):
# - Audit: known vulnerabilities in our dependencies (scripts/security-audit.js:
#   any advisory in code that ships in the extension, high or critical anywhere).
# - Dependency review (PRs only): blocks a PR that adds a vulnerable package or
#   one under a license we cannot ship.
# - CodeQL: static security analysis of our own code (JS / TS, the Python
#   pytest plugin, these workflows). Results: Security → Code scanning.
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
      - run: node scripts/security-audit.js

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Licenses the extension can ship under its MIT license.
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Python-2.0, Unlicense
          comment-summary-in-pr: never

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
