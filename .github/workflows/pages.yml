name: Guide (GitHub Pages)

# Publishes docs/live-test-runner-guide.html as the project's docs site
# (https://eshandias.github.io/live-test-runner/) whenever it changes on main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['docs/live-test-runner-guide.html', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the site
        run: |
          mkdir -p _site
          cp docs/live-test-runner-guide.html _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
