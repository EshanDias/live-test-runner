name: Feature request
description: An idea to make Live Test Runner better
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: What are you trying to do, and what gets in the way today?
      placeholder: "When a snapshot test fails I have to …"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      description: How you picture it working — in the editor, the Explorer, the Results panel…
    validations:
      required: true
  - type: textarea
    id: mockup
    attributes:
      label: Mock-ups, sketches or diagrams
      description: |
        Optional — anything that shows the idea: a screenshot with notes, a hand sketch, a mock-up, or a diagram.
        Drag images in here, or write a [Mermaid](https://mermaid.js.org) diagram in a ```mermaid block — GitHub draws it.
      placeholder: |
        ```mermaid
        flowchart LR
          Save --> Rerun --> Result
        ```
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - A new test framework
        - Running tests / on-save reruns
        - Results panel / Explorer
        - Editor (gutter, CodeLens, coverage bars)
        - Coverage
        - Debugging
        - Monorepos / multi-root workspaces
        - Other
  - type: input
    id: framework
    attributes:
      label: Test framework(s) involved
      placeholder: "Jest, Vitest, pytest, Mocha, Playwright…"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Other tools or workarounds, if any.
