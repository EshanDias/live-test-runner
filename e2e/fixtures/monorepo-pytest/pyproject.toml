# A uv workspace (pytest plan phase 7): no pytest config at the root, so each
# member with tests is its own project. pytest is the shared dev dependency.
[project]
name = "monorepo-pytest-fixture"
version = "0.0.0"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "coverage>=7.6"]
